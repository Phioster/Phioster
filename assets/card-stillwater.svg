<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"
     font-family="'DejaVu Sans Mono','Menlo','Courier New',monospace">
  <defs>
    <filter id="cw" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="898" height="298" rx="14" fill="#050805" stroke="#0f3d1e" stroke-width="1.8"/>
  <path d="M1 15 A14 14 0 0 1 15 1 L885 1 A14 14 0 0 1 899 15 L899 52 L1 52 Z" fill="#0c140c"/>
  <circle cx="34" cy="27" r="7.5" fill="#ff5f56"/><circle cx="60" cy="27" r="7.5" fill="#ffbd2e"/><circle cx="86" cy="27" r="7.5" fill="#27c93f"/>
  <text x="450" y="34" fill="#2f6b3f" font-size="18" text-anchor="middle">phioster@github ~ stillwater</text>

  <rect x="40" y="80" width="6" height="40" fill="#22c3d6"/>
  <text x="58" y="115" fill="#22c3d6" font-size="40" font-weight="bold" filter="url(#cw)">Stillwater</text>

  <g font-size="26" fill="#c9d1d9">
    <text x="58" y="166">a quiet 2D pixel-art idle fishing game for Android,</text>
    <text x="58" y="202">built in Godot. fish a lake, sell the catch, buy</text>
    <text x="58" y="238">gear, and unlock zones, bait and rarer fish.</text>
  </g>

  <text x="58" y="276" font-size="24" xml:space="preserve"><tspan fill="#22c3d6">stack</tspan><tspan fill="#2f6b3f"> ..... </tspan><tspan fill="#c9d1d9">Godot 4.7.2 · GDScript · Android</tspan></text>
</svg>
